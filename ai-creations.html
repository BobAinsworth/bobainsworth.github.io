<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Bob's AI Creations — Bob Ainsworth</title>

  <meta
    name="description"
    content="AI images, flyers, infographics and AI videos created by Bob."
  />

  <style>
    :root{
      --bg:#fef3c7;
      --surface:#fff8e1;
      --card:#fff8e1;
      --text:#2f2417;
      --muted:#6b5538;
      --accent:#b45309;
      --accent-2:#d97706;
      --ring:rgba(180,83,9,0.25);
      --shadow:0 8px 20px rgba(120,72,15,0.09);
      --border:rgba(146,64,14,0.16);
      --radius:18px;
      --radius-lg:22px;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      height:100%;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,
           Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .wrap{
      max-width:1200px;
      margin:auto;
      padding:18px 20px 64px;
    }

    .hero{
      position:relative;
      overflow:hidden;
      border-radius:var(--radius-lg);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      isolation:isolate;
      min-height:clamp(90px,14vh,150px);
      display:flex;
      align-items:center;
      padding:clamp(12px,3vw,20px);

      background:
        radial-gradient(
          400px at 20% 20%,
          rgba(217,119,6,0.16),
          transparent 60%
        ),
        radial-gradient(
          500px at 80% 10%,
          rgba(245,158,11,0.13),
          transparent 70%
        ),
        linear-gradient(
          180deg,
          var(--surface),
          color-mix(in oklab, var(--surface) 70%, white 30%)
        );
    }

    .brand{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .logo{
      width:46px;
      height:46px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent-2)
      );
      color:#fffdf5;
      font-weight:800;
      box-shadow:0 6px 12px var(--ring);
      user-select:none;
      text-decoration:none;
    }

    h1{
      margin:0;
      font-size:clamp(22px,2.3vw,28px);
    }

    .tagline{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    main{
      margin-top:20px;
    }

    nav.breadcrumb{
      margin:12px 0;
      color:var(--muted);
      font-size:14px;
    }

    nav.breadcrumb a{
      color:var(--muted);
      text-decoration:none;
      border-bottom:1px dotted var(--border);
    }

    nav.breadcrumb a:hover{
      color:var(--accent);
      border-bottom-color:var(--accent);
    }

    .section{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:22px 24px;
      margin-top:18px;
    }

    .section h2{
      margin:0 0 8px;
      font-size:clamp(18px,1.8vw,20px);
    }

    .section p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
    }

    .creation{
      margin:22px 0;
    }

    .creation:last-child{
      margin-bottom:0;
    }

    .creation a{
      display:block;
      color:#000000;
      font-weight:600;
      text-decoration:none;
      margin:0 0 4px;
      line-height:1.5;
    }

    .creation a:hover{
      color:#000000;
      text-decoration:underline;
    }

    .creation-description{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.55;
    }

    footer{
      margin-top:28px;
      color:var(--muted);
      font-size:14px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
    }

    .links{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .links a{
      color:var(--muted);
      text-decoration:none;
      border-bottom:1px dotted var(--border);
    }

    .links a:hover{
      color:var(--accent);
      border-bottom-color:var(--accent);
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header class="hero" role="banner">
      <div class="brand">

        <a
          href="index.html"
          class="logo"
          aria-label="Home"
        >
          BA
        </a>

        <div>
          <h1>Bob's AI Creations</h1>

          <p class="tagline">
            AI images, flyers, infographics and AI videos created by Bob
          </p>
        </div>

      </div>
    </header>

    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      &nbsp;→&nbsp;
      <span>Bob's AI Creations</span>
    </nav>

    <main>
      <section class="section">

        <h2>Bob's AI Creations</h2>

        <p>
          AI images, flyers, infographics and AI videos created by Bob
        </p>

        <!-- Add future creations inside this single section.

        Example:

        <div class="creation">
          <a
            href="LINK-GOES-HERE"
            target="_blank"
            rel="noopener"
          >
            Title of Creation
          </a>

          <p class="creation-description">
            A short description of the creation.
          </p>
        </div>

        -->

      </section>
    </main>

    <footer>

      <div class="links">
        <a
          href="https://youtube.com/@BobsAIChannel"
          rel="me noopener"
        >
          AI YouTube
        </a>

        <a
          href="https://youtube.com/@CaleroBob"
          rel="me noopener"
        >
          Music YouTube
        </a>

        <a
          href="https://www.linkedin.com/in/bob-ainsworth-56b686"
          rel="me noopener"
        >
          LinkedIn
        </a>

        <a
          href="https://bobainsworthgallery.smugmug.com"
          rel="me noopener"
        >
          Photo Gallery
        </a>

        <a
          href="https://open.spotify.com/user/calerobob"
          rel="me noopener"
        >
          Spotify
        </a>

        <a
          href="https://bobainsworth.github.io"
          rel="me noopener"
        >
          GitHub
        </a>
      </div>

      <div>
        &copy; <span id="y"></span> Bob Ainsworth
      </div>

    </footer>

  </div>

  <script>
    var yearSpan = document.getElementById('y');

    if (yearSpan) {
      yearSpan.textContent = new Date().getFullYear();
    }
  </script>
</body>
</html>
